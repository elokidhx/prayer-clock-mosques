<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Qibla</title>
<style>
:root{--bg:#F1F4F3;--card:#fff;--ink:#12343B;--sub:#5C7378;--line:#D6DFDD;--teal:#1F6F6A;--teal-soft:#DCEDEA;--gold:#A9781F;--ok:#1E7B34;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0D191C;--card:#14242A;--ink:#E3ECEA;--sub:#93A8AB;--line:#24383E;--teal:#6FC2B8;--teal-soft:#173634;--gold:#E8BE6E;--ok:#7BD88F;--on:#0D191C;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Nastaliq Urdu",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
h1{font-size:22px;margin:6px 0 0;color:var(--teal)}
.sub{color:var(--sub);font-size:14px}
#dial{width:min(80vw,340px);height:min(80vw,340px);position:relative;margin:8px 0}
#rose{width:100%;height:100%;transition:transform .12s linear}
#pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid var(--ink)}
#status{font-size:24px;font-weight:700;min-height:1.5em}
#status.ok{color:var(--ok)}
.deg{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--teal);background:var(--teal);color:var(--on);font-weight:600;padding:12px 22px;min-height:48px}
button.plain{background:none;color:var(--teal)}
.note{color:var(--sub);font-size:14px;margin:4px 0;max-width:30em}
.warn{background:var(--teal-soft);border-radius:12px;padding:10px 14px;font-size:15px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1 id="title">Qibla</h1>
  <div class="sub" id="place"></div>
  <div id="dial" aria-hidden="true">
    <div id="pointer"></div>
    <svg id="rose" viewBox="0 0 200 200"></svg>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="deg" id="bearing"></div>
  <button id="start" type="button">Start the compass</button>
  <button id="locate" type="button" class="plain" hidden>Use my location</button>
  <div class="warn" id="warn" hidden></div>
  <p class="note" id="hold"></p>
  <p class="note" id="privacy"></p>
</main>
<script>
"use strict";
// Al Israa clock: the live Qibla compass. Opened from the clock's phone page
// (which can't use the compass: phones give it only to secure pages). The
// place comes in the part of the link after "#", which browsers never send
// to the server; nothing is stored or sent anywhere.
const T = {
  en: { title: "Qibla", start: "Start the compass", locate: "Use my location", from: "{0} from North", place: "From {0}",
        turnR: "Turn right {0}", turnL: "Turn left {0}", facing: "You are facing the Qibla",
        hold: "Hold the phone flat, away from metal, magnets and speakers. If the direction seems wrong, move the phone in a figure 8 a few times.",
        privacy: "Your location stays on this phone. Accurate to within a few degrees.",
        noSensor: "This phone or browser doesn't give a compass. The Qibla is {0} from North: use a compass, or the sun times on the clock's phone page.",
        denied: "The compass wasn't allowed. Allow motion and orientation for this page, then try again.",
        calibrate: "The compass needs calibrating: move the phone in a figure 8 a few times.",
        noPlace: "Open this page from the clock's phone page (Qibla), or use your location.", locFail: "Your location couldn't be found." },
  ar: { title: "القبلة", start: "تشغيل البوصلة", locate: "استخدام موقعي", from: "{0} من الشمال", place: "من {0}",
        turnR: "استدر يميناً {0}", turnL: "استدر يساراً {0}", facing: "أنت متّجه إلى القبلة",
        hold: "أمسك الهاتف أفقياً بعيداً عن المعادن والمغناطيس ومكبرات الصوت. إن بدا الاتجاه خاطئاً فحرّك الهاتف على شكل الرقم 8 عدة مرات.",
        privacy: "يبقى موقعك على هذا الهاتف. الدقة في حدود درجات قليلة.",
        noSensor: "لا يوفّر هذا الهاتف أو المتصفح بوصلة. القبلة على {0} من الشمال: استخدم بوصلة، أو أوقات الشمس في صفحة الهاتف للساعة.",
        denied: "لم يُسمح باستخدام البوصلة. اسمح بالحركة والاتجاه لهذه الصفحة ثم حاول مرة أخرى.",
        calibrate: "تحتاج البوصلة إلى معايرة: حرّك الهاتف على شكل الرقم 8 عدة مرات.",
        noPlace: "افتح هذه الصفحة من صفحة الهاتف للساعة (القبلة)، أو استخدم موقعك.", locFail: "تعذّر تحديد موقعك." },
  fr: { title: "Qibla", start: "Lancer la boussole", locate: "Utiliser ma position", from: "{0} depuis le nord", place: "Depuis {0}",
        turnR: "Tournez à droite de {0}", turnL: "Tournez à gauche de {0}", facing: "Vous êtes face à la Qibla",
        hold: "Tenez le téléphone à plat, loin du métal, des aimants et des haut-parleurs. Si la direction semble fausse, décrivez un 8 avec le téléphone plusieurs fois.",
        privacy: "Votre position reste sur ce téléphone. Précis à quelques degrés près.",
        noSensor: "Ce téléphone ou ce navigateur ne fournit pas de boussole. La Qibla est à {0} du nord : utilisez une boussole, ou les heures du soleil sur la page téléphone de l'horloge.",
        denied: "La boussole n'a pas été autorisée. Autorisez le mouvement et l'orientation pour cette page, puis réessayez.",
        calibrate: "La boussole doit être calibrée : décrivez un 8 avec le téléphone plusieurs fois.",
        noPlace: "Ouvrez cette page depuis la page téléphone de l'horloge (Qibla), ou utilisez votre position.", locFail: "Votre position n'a pas pu être trouvée." },
  de: { title: "Qibla", start: "Kompass starten", locate: "Meinen Standort verwenden", from: "{0} von Norden", place: "Von {0}",
        turnR: "{0} nach rechts drehen", turnL: "{0} nach links drehen", facing: "Sie blicken zur Qibla",
        hold: "Halten Sie das Telefon flach, fern von Metall, Magneten und Lautsprechern. Wirkt die Richtung falsch, bewegen Sie das Telefon einige Male in Form einer 8.",
        privacy: "Ihr Standort bleibt auf diesem Telefon. Genau auf wenige Grad.",
        noSensor: "Dieses Telefon oder dieser Browser bietet keinen Kompass. Die Qibla liegt {0} von Norden: Nutzen Sie einen Kompass oder die Sonnenzeiten auf der Telefonseite der Uhr.",
        denied: "Der Kompass wurde nicht erlaubt. Erlauben Sie Bewegung und Ausrichtung für diese Seite und versuchen Sie es erneut.",
        calibrate: "Der Kompass muss kalibriert werden: Bewegen Sie das Telefon einige Male in Form einer 8.",
        noPlace: "Öffnen Sie diese Seite über die Telefonseite der Uhr (Qibla) oder verwenden Sie Ihren Standort.", locFail: "Ihr Standort wurde nicht gefunden." },
  es: { title: "Qibla", start: "Iniciar la brújula", locate: "Usar mi ubicación", from: "{0} desde el norte", place: "Desde {0}",
        turnR: "Gire {0} a la derecha", turnL: "Gire {0} a la izquierda", facing: "Está mirando hacia la Qibla",
        hold: "Sujete el teléfono en horizontal, lejos de metales, imanes y altavoces. Si la dirección parece incorrecta, mueva el teléfono en forma de 8 varias veces.",
        privacy: "Su ubicación se queda en este teléfono. Precisión de unos pocos grados.",
        noSensor: "Este teléfono o navegador no ofrece brújula. La Qibla está a {0} del norte: use una brújula, o las horas del sol en la página del teléfono del reloj.",
        denied: "No se permitió la brújula. Permita movimiento y orientación para esta página e inténtelo de nuevo.",
        calibrate: "La brújula necesita calibrarse: mueva el teléfono en forma de 8 varias veces.",
        noPlace: "Abra esta página desde la página del teléfono del reloj (Qibla), o use su ubicación.", locFail: "No se pudo encontrar su ubicación." },
  tr: { title: "Kıble", start: "Pusulayı başlat", locate: "Konumumu kullan", from: "Kuzeyden {0}", place: "{0} konumundan",
        turnR: "{0} sağa dönün", turnL: "{0} sola dönün", facing: "Kıbleye dönüksünüz",
        hold: "Telefonu düz tutun; metal, mıknatıs ve hoparlörlerden uzak durun. Yön yanlış görünürse telefonu birkaç kez 8 çizerek hareket ettirin.",
        privacy: "Konumunuz bu telefonda kalır. Birkaç derece hassasiyetle.",
        noSensor: "Bu telefon veya tarayıcı pusula sunmuyor. Kıble kuzeyden {0}: bir pusula ya da saatin telefon sayfasındaki güneş vakitlerini kullanın.",
        denied: "Pusulaya izin verilmedi. Bu sayfa için hareket ve yön iznini verip tekrar deneyin.",
        calibrate: "Pusulanın ayarlanması gerekiyor: telefonu birkaç kez 8 çizerek hareket ettirin.",
        noPlace: "Bu sayfayı saatin telefon sayfasından (Kıble) açın ya da konumunuzu kullanın.", locFail: "Konumunuz bulunamadı." },
  ur: { title: "قبلہ", start: "قطب نما شروع کریں", locate: "میرا مقام استعمال کریں", from: "شمال سے {0}", place: "{0} سے",
        turnR: "{0} دائیں مڑیں", turnL: "{0} بائیں مڑیں", facing: "آپ کا رخ قبلہ کی طرف ہے",
        hold: "فون کو سیدھا افقی رکھیں، دھات، مقناطیس اور اسپیکروں سے دور۔ اگر سمت غلط لگے تو فون کو چند بار 8 کی شکل میں گھمائیں۔",
        privacy: "آپ کا مقام اسی فون پر رہتا ہے۔ چند درجے تک درست۔",
        noSensor: "یہ فون یا براؤزر قطب نما فراہم نہیں کرتا۔ قبلہ شمال سے {0} پر ہے: قطب نما استعمال کریں، یا گھڑی کے فون صفحے پر سورج کے اوقات۔",
        denied: "قطب نما کی اجازت نہیں ملی۔ اس صفحے کے لیے حرکت اور سمت کی اجازت دیں، پھر دوبارہ کوشش کریں۔",
        calibrate: "قطب نما کو درست کرنے کی ضرورت ہے: فون کو چند بار 8 کی شکل میں گھمائیں۔",
        noPlace: "یہ صفحہ گھڑی کے فون صفحے (قبلہ) سے کھولیں، یا اپنا مقام استعمال کریں۔", locFail: "آپ کا مقام معلوم نہیں ہو سکا۔" },
  nl: { title: "Qibla", start: "Kompas starten", locate: "Mijn locatie gebruiken", from: "{0} vanaf het noorden", place: "Vanuit {0}",
        turnR: "Draai {0} naar rechts", turnL: "Draai {0} naar links", facing: "U kijkt naar de Qibla",
        hold: "Houd de telefoon plat, uit de buurt van metaal, magneten en luidsprekers. Lijkt de richting fout, beweeg de telefoon dan een paar keer in de vorm van een 8.",
        privacy: "Uw locatie blijft op deze telefoon. Nauwkeurig tot op enkele graden.",
        noSensor: "Deze telefoon of browser heeft geen kompas. De Qibla ligt op {0} vanaf het noorden: gebruik een kompas, of de zonnetijden op de telefoonpagina van de klok.",
        denied: "Het kompas is niet toegestaan. Sta beweging en richting toe voor deze pagina en probeer het opnieuw.",
        calibrate: "Het kompas moet worden gekalibreerd: beweeg de telefoon een paar keer in de vorm van een 8.",
        noPlace: "Open deze pagina via de telefoonpagina van de klok (Qibla), of gebruik uw locatie.", locFail: "Uw locatie kon niet worden gevonden." },
};
const KAABA = [21.4225, 39.8262];
const $ = (id) => document.getElementById(id);
// Angles are isolated (U+2066…2069) so "258°" stays in order in Arabic and Urdu.
const fill = (s, ...v) => String(s).replace(/\{(\d+)\}/g, (m, i) => v[+i] == null ? m : typeof v[+i] === "number" ? "\u2066" + v[+i] + "°\u2069" : v[+i]);
const args = new URLSearchParams(location.hash.slice(1));
const lang = T[args.get("lang")] ? args.get("lang") : ((navigator.language || "en").slice(0, 2) in T ? (navigator.language || "en").slice(0, 2) : "en");
const t = T[lang];
document.documentElement.lang = lang;
document.documentElement.dir = lang === "ar" || lang === "ur" ? "rtl" : "ltr";
document.title = t.title;
$("title").textContent = t.title;
$("start").textContent = t.start;
$("locate").textContent = t.locate;
$("hold").textContent = t.hold;
$("privacy").textContent = t.privacy;

const rad = (d) => d * Math.PI / 180, deg = (r) => r * 180 / Math.PI;
function bearing(lat, lng) {
  const p = rad(lat), dl = rad(KAABA[1] - lng);
  return (deg(Math.atan2(Math.sin(dl), Math.cos(p) * Math.tan(rad(KAABA[0])) - Math.sin(p) * Math.cos(dl))) + 360) % 360;
}
let qibla = null;

// The rose: North up, 30° ticks, the Kaaba on the Qibla direction.
function drawRose() {
  const ns = "http://www.w3.org/2000/svg", svg = $("rose");
  svg.replaceChildren();
  const add = (tag, a) => { const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]); svg.append(e); return e; };
  add("circle", { cx: 100, cy: 100, r: 96, fill: "var(--card)", stroke: "var(--line)", "stroke-width": 2 });
  for (let a = 0; a < 360; a += 10) {
    const big = a % 90 === 0, mid = a % 30 === 0, s = Math.sin(rad(a)), c = -Math.cos(rad(a));
    const r2 = big ? 78 : mid ? 84 : 88;
    add("line", { x1: 100 + 93 * s, y1: 100 + 93 * c, x2: 100 + r2 * s, y2: 100 + r2 * c, stroke: big ? "var(--ink)" : "var(--sub)", "stroke-width": big ? 3 : mid ? 1.8 : 1, "stroke-linecap": "round" });
  }
  const n = add("text", { x: 100, y: 38, "text-anchor": "middle", "font-size": 20, "font-weight": 700, fill: "#C62828" });
  n.textContent = "N";
  if (qibla == null) return;
  const g = add("g", { transform: `rotate(${qibla.toFixed(1)} 100 100)` });
  const line = document.createElementNS(ns, "line");
  for (const [k, v] of Object.entries({ x1: 100, y1: 100, x2: 100, y2: 40, stroke: "var(--teal)", "stroke-width": 8, "stroke-linecap": "round" })) line.setAttribute(k, v);
  const tip = document.createElementNS(ns, "path");
  tip.setAttribute("d", "M100 24 L86 48 L114 48 Z"); tip.setAttribute("fill", "var(--teal)");
  const kaaba = document.createElementNS(ns, "rect");
  for (const [k, v] of Object.entries({ x: 90, y: 2, width: 20, height: 20, rx: 2, fill: "#1b1b1b", stroke: "var(--gold)", "stroke-width": 3 })) kaaba.setAttribute(k, v);
  g.append(line, tip, kaaba);
  add("circle", { cx: 100, cy: 100, r: 8, fill: "var(--teal)" });
}

function setPlace(lat, lng, name) {
  qibla = bearing(lat, lng);
  $("place").textContent = name ? fill(t.place, name) : `${lat.toFixed(3)}, ${lng.toFixed(3)}`;
  $("bearing").textContent = fill(t.from, Math.round(qibla));
  $("locate").hidden = true;
  drawRose();
}
function warn(text) { const w = $("warn"); w.textContent = text || ""; w.hidden = !text; }

const lat = parseFloat(args.get("lat")), lng = parseFloat(args.get("lng"));
if (isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
  setPlace(lat, lng, args.get("city"));
} else {
  drawRose();
  warn(t.noPlace);
  $("locate").hidden = false;
}
$("locate").addEventListener("click", () => {
  if (!navigator.geolocation) return warn(t.locFail);
  navigator.geolocation.getCurrentPosition(
    (p) => { warn(""); setPlace(p.coords.latitude, p.coords.longitude, null); },
    () => warn(t.locFail), { enableHighAccuracy: false, timeout: 15000, maximumAge: 600000 });
});

// ---------- the compass ----------
let heading = null, turned = 0, gotEvent = false, wasFacing = false;
const screenAngle = () => (screen.orientation && typeof screen.orientation.angle === "number") ? screen.orientation.angle : (window.orientation || 0);

function onHeading(h, accuracy) {
  gotEvent = true;
  h = (h + screenAngle() + 360) % 360;
  // Smooth on the circle (no jump at 359° → 0°).
  if (heading == null) { heading = h; turned = h; }
  else {
    const d = (((h - heading + 540) % 360) - 180) * 0.25;
    heading = (heading + d + 360) % 360;
    turned += d; // never wraps, so the rose never spins the long way round
  }
  $("rose").style.transform = `rotate(${(-turned).toFixed(1)}deg)`;
  if (accuracy != null && (accuracy < 0 || accuracy > 25)) warn(t.calibrate);
  else if ($("warn").textContent === t.calibrate) warn("");
  if (qibla == null) return;
  const off = Math.round(((qibla - heading + 540) % 360) - 180);
  const facing = Math.abs(off) <= 5;
  const s = $("status");
  s.textContent = facing ? "✓ " + t.facing : fill(off > 0 ? t.turnR : t.turnL, Math.abs(off));
  s.className = facing ? "ok" : "";
  if (facing && !wasFacing && navigator.vibrate) navigator.vibrate(60);
  wasFacing = facing;
}

function listen(denied) {
  if (listening) return check(denied);
  listening = true;
  if ("ondeviceorientationabsolute" in window) {
    // Android (Chrome): alpha against North, counter-clockwise.
    window.addEventListener("deviceorientationabsolute", (e) => { if (e.alpha != null) onHeading(360 - e.alpha); });
  } else {
    window.addEventListener("deviceorientation", (e) => {
      if (typeof e.webkitCompassHeading === "number") onHeading(e.webkitCompassHeading, e.webkitCompassAccuracy); // iPhone
      else if (e.absolute && e.alpha != null) onHeading(360 - e.alpha);
    });
  }
  check(denied);
}
// Nothing after 3 s: refused, or no compass on this phone.
function check(denied) {
  setTimeout(() => {
    if (gotEvent) return;
    if (denied) { $("start").hidden = false; warn(t.denied); }
    else warn(fill(t.noSensor, qibla == null ? "?" : Math.round(qibla)));
  }, 3000);
}

$("start").addEventListener("click", async () => {
  $("start").hidden = true;
  warn("");
  const D = window.DeviceOrientationEvent;
  if (!D) return warn(fill(t.noSensor, qibla == null ? "?" : Math.round(qibla)));
  let denied = false;
  if (typeof D.requestPermission === "function") {
    // iPhone (and some browsers): the compass is allowed only after a tap.
    try { denied = (await D.requestPermission()) !== "granted"; } catch (_) { denied = true; }
  }
  listen(denied);
});
let listening = false;
</script>
</body>
</html>
